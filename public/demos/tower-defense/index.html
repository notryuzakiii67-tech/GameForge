<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0c1d" />
  <title>Tower Defense — GameForge demo</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <h1>Tower Defense</h1>
      <p class="tagline">Place towers, stop the creeps from reaching the base.</p>
    </header>

    <section class="hud" aria-label="Game statistics">
      <div class="stat"><span class="stat-label">Money</span><span class="stat-value" id="money">100</span></div>
      <div class="stat"><span class="stat-label">Lives</span><span class="stat-value" id="lives">20</span></div>
      <div class="stat"><span class="stat-label">Wave</span><span class="stat-value" id="wave">0</span></div>
    </section>

    <div class="stage">
      <canvas id="game" width="520" height="520" aria-label="Tower Defense game board"></canvas>
      <p class="message" id="message" role="status" aria-live="polite">Click an empty tile to build a tower (30). Then Start Wave.</p>
    </div>

    <footer class="controls">
      <button class="btn" id="start" type="button">Start Wave</button>
      <button class="btn" id="pause" type="button" disabled>Pause</button>
      <button class="btn" id="restart" type="button">Restart</button>
    </footer>
  </main>

  <script src="engine.js"></script>
  <script src="game.js"></script>
</body>
</html>
